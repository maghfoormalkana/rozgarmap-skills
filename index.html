<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RozgarMap Skill Competition - Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
.center-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  height: calc(100vh - 80px);
}
.setup-card {
  width: 600px;
  padding: 40px;
}
.setup-card h2 {
  font-family: 'Orbitron', sans-serif;
  margin-bottom: 25px;
  text-align: center;
  font-size: 24px;
  color: var(--text-main);
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.full {
  grid-column: 1 / -1;
}
label {
  font-size: 13px;
  margin-bottom: 5px;
  display: block;
  color: var(--text-muted);
  font-weight: 500;
}
input, select {
  margin-top: 5px;
}
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <img src="Logo RM.png" alt="RozgarMap Logo">
  </div>
  <div class="title">RozgarMap Skill Competition <br><span class="neon-text">Organizers: Maghfoor & Sakshi</span></div>
  <div class="status header-actions">
    Setup Panel
    <button id="themeToggle" class="icon-btn" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
  </div>
</header>

<div class="center-wrapper">
  <div class="card setup-card">
    <h2>Competition Setup</h2>
    <div class="grid">
      <div class="full">
        <label><i class="fa-solid fa-user"></i> Student Name</label>
        <input type="text" id="studentNameInput" placeholder="Enter Student Name" required>
      </div>
      <div>
        <label><i class="fa-solid fa-clock"></i> Duration (Minutes)</label>
        <input type="number" id="durationInput" value="10" min="1">
      </div>
      <div>
        <label><i class="fa-solid fa-gamepad"></i> Mode</label>
        <select id="modeInput">
          <option value="practice">Practice</option>
          <option value="exam">Exam</option>
          <option value="championship">Championship</option>
        </select>
      </div>
      <div class="full">
        <button onclick="startCompetition()" class="primary-btn" style="width:100%; margin-top:20px;">
          <i class="fa-solid fa-play"></i> START COMPETITION
        </button>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
function startCompetition(){
  const student = document.getElementById("studentNameInput").value.trim();
  const duration = document.getElementById("durationInput").value;
  const mode = document.getElementById("modeInput").value;

  if(!student){
    alert("Please enter Student Name");
    return;
  }

  const settings = { student, duration, mode };
  localStorage.setItem("competitionSettings", JSON.stringify(settings));
  window.location.href = "competition.html";
}
</script>
</body>
</html>
